<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineStream - Personal Cinema</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            red: '#E50914',
                            dark: '#070708',
                            card: '#121215',
                            border: '#1F1F24',
                            hover: '#1A1A1E'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #070708; }
        ::-webkit-scrollbar-thumb { background: #1F1F24; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #E50914; }
    </style>
</head>
<body class="bg-brand-dark text-gray-100 font-sans min-h-screen flex flex-col antialiased selection:bg-brand-red selection:text-white">

    <!-- Header & Navigation -->
    <header class="sticky top-0 z-40 bg-brand-dark/90 backdrop-blur-xl border-b border-brand-border/80 px-4 sm:px-8 py-4">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            
            <!-- Brand Logo -->
            <div class="flex items-center space-x-3 cursor-pointer group" onclick="resetToHome()">
                <div class="bg-brand-red p-2.5 rounded-xl shadow-lg shadow-brand-red/30 group-hover:scale-105 transition-transform duration-200">
                    <i class="fa-solid fa-play text-sm text-white"></i>
                </div>
                <span class="text-xl font-black tracking-wider text-white">CINE<span class="text-brand-red">STREAM</span></span>
            </div>

            <!-- Search & Direct ID Bar -->
            <div class="flex items-center gap-2.5 w-full md:w-auto flex-1 max-w-2xl justify-end">
                <form id="search-form" class="relative flex-1 max-w-md">
                    <div class="relative flex items-center">
                        <i class="fa-solid fa-magnifying-glass absolute left-3.5 text-gray-500 text-xs"></i>
                        <input 
                            type="text" 
                            id="search-input" 
                            placeholder="Search any movie worldwide..." 
                            class="w-full bg-brand-card text-gray-200 text-xs rounded-xl pl-10 pr-8 py-3 border border-brand-border focus:outline-none focus:border-brand-red transition-all placeholder-gray-500 shadow-inner"
                            autocomplete="off"
                        >
                        <button type="button" id="clear-search" class="hidden absolute right-3.5 text-gray-500 hover:text-white text-xs">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                </form>

                <!-- Direct ID Input -->
                <div class="flex items-center space-x-2">
                    <input 
                        type="text" 
                        id="direct-id-input" 
                        placeholder="TMDB ID..." 
                        class="bg-brand-card text-xs text-gray-200 px-3.5 py-3 rounded-xl border border-brand-border focus:outline-none focus:border-brand-red w-28 sm:w-32 shadow-inner"
                    >
                    <button 
                        onclick="playDirectId()" 
                        class="bg-brand-red hover:bg-red-700 text-white font-bold text-xs px-4 py-3 rounded-xl transition-all shadow-md shadow-brand-red/20 whitespace-nowrap flex items-center gap-1.5"
                    >
                        <i class="fa-solid fa-play text-[10px]"></i> Play
                    </button>
                </div>
            </div>

        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-8 py-8">
        
        <!-- Status Header -->
        <div class="flex items-center justify-between mb-6 pb-4 border-b border-brand-border/60">
            <div>
                <h1 id="section-title" class="text-xl sm:text-2xl font-extrabold tracking-tight text-white flex items-center gap-2.5">
                    Trending Movies
                </h1>
                <p class="text-xs text-gray-500 mt-0.5">Live database powered by TMDB & multi-server switching</p>
            </div>
            <div id="result-count" class="text-[11px] font-semibold px-3 py-1 bg-brand-card text-gray-400 rounded-lg border border-brand-border">
                Ready
            </div>
        </div>

        <!-- Movie Grid Container -->
        <div id="movie-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 sm:gap-6">
            <!-- Rendered dynamically -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden flex-col items-center justify-center py-20 text-center">
            <div class="w-16 h-16 bg-brand-card rounded-full flex items-center justify-center mb-3 text-gray-600 text-2xl border border-brand-border shadow-inner">
                <i class="fa-solid fa-film"></i>
            </div>
            <h3 class="text-lg font-bold text-gray-300">No Movies Found</h3>
            <p class="text-gray-500 text-xs max-w-xs mt-1">Try searching for another title or check your spelling.</p>
        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-brand-border/80 bg-brand-dark py-6 px-4 sm:px-8 text-center text-xs text-gray-600">
        <p>&copy; CineStream Personal Cinema. Multi-Server Infrastructure.</p>
    </footer>

    <!-- Movie Player Modal -->
    <div id="movie-modal" class="fixed inset-0 z-50 hidden bg-black/95 backdrop-blur-2xl flex items-center justify-center p-2 sm:p-6 overflow-y-auto">
        <div class="relative bg-brand-card w-full max-w-5xl rounded-2xl overflow-hidden shadow-2xl border border-brand-border my-auto flex flex-col">
            
            <!-- Minimal Modal Header -->
            <div class="flex items-center justify-between px-6 py-4 border-b border-brand-border bg-black/40">
                <div class="flex items-center space-x-3">
                    <span class="w-2.5 h-2.5 rounded-full bg-brand-red animate-pulse shadow-lg shadow-brand-red"></span>
                    <h2 id="modal-title" class="text-base sm:text-lg font-bold text-white truncate max-w-md">Movie Title</h2>
                </div>
                
                <button id="close-modal" onclick="closeModal()" class="w-9 h-9 bg-brand-border/40 hover:bg-brand-red text-gray-400 hover:text-white rounded-xl flex items-center justify-center transition-colors">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
            </div>

            <!-- Server Selector Bar -->
            <div class="bg-brand-dark px-6 py-2.5 border-b border-brand-border flex items-center justify-between gap-2 text-xs">
                <span class="text-gray-400 font-medium flex items-center gap-1.5">
                    <i class="fa-solid fa-server text-brand-red"></i> Switch Server:
                </span>
                <div class="flex items-center gap-2">
                    <button onclick="switchServer('vidlink')" id="btn-server-vidlink" class="server-btn bg-brand-red text-white font-bold px-3 py-1.5 rounded-lg transition-colors">
                        Server 1 (VidLink)
                    </button>
                    <button onclick="switchServer('vidsrc')" id="btn-server-vidsrc" class="server-btn bg-brand-border hover:bg-brand-hover text-gray-300 font-medium px-3 py-1.5 rounded-lg transition-colors">
                        Server 2 (VidSrc)
                    </button>
                    <button onclick="switchServer('embedsu')" id="btn-server-embedsu" class="server-btn bg-brand-border hover:bg-brand-hover text-gray-300 font-medium px-3 py-1.5 rounded-lg transition-colors">
                        Server 3 (EmbedSu)
                    </button>
                </div>
            </div>

            <!-- Video Player Frame -->
            <div class="relative w-full aspect-video bg-black flex items-center justify-center shadow-2xl">
                <iframe 
                    id="stream-iframe" 
                    class="w-full h-full border-0" 
                    allowfullscreen 
                    allow="autoplay; encrypted-media; picture-in-picture"
                ></iframe>
            </div>

            <!-- Compact Movie Metadata -->
            <div class="p-6 bg-brand-card">
                <div class="flex items-center gap-3 text-xs text-gray-400 mb-2">
                    <span id="modal-year" class="font-bold text-gray-200">Year</span>
                    <span>&bull;</span>
                    <span id="modal-imdb-id" class="bg-amber-500/10 text-amber-400 px-2.5 py-0.5 rounded text-[11px] font-mono border border-amber-500/20 font-semibold">ID</span>
                </div>
                <p id="modal-overview" class="text-gray-400 text-xs sm:text-sm leading-relaxed max-w-3xl">
                    Overview...
                </p>
            </div>

        </div>
    </div>

    <!-- Script Logic -->
    <script>
        const TMDB_API_KEY = "3fd2be6f0c70a2a598f084ddfb75487c";
        const TMDB_IMAGE_BASE = "https://image.tmdb.org/t/p/w500";

        let currentActiveMovie = null;
        let currentServer = 'vidlink';

        /* DOM Elements */
        const movieGrid = document.getElementById('movie-grid');
        const searchForm = document.getElementById('search-form');
        const searchInput = document.getElementById('search-input');
        const clearSearchBtn = document.getElementById('clear-search');
        const emptyState = document.getElementById('empty-state');
        const resultCount = document.getElementById('result-count');
        const sectionTitle = document.getElementById('section-title');
        
        const movieModal = document.getElementById('movie-modal');
        const streamIframe = document.getElementById('stream-iframe');
        const modalTitle = document.getElementById('modal-title');
        const modalYear = document.getElementById('modal-year');
        const modalImdbId = document.getElementById('modal-imdb-id');
        const modalOverview = document.getElementById('modal-overview');

        /* Initialize App - Load Trending Movies on Startup */
        window.addEventListener('DOMContentLoaded', () => {
            fetchTrendingMovies();
            setupEvents();
        });

        function setupEvents() {
            searchForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const query = searchInput.value.trim();
                if (query) searchMovies(query);
            });

            let searchTimeout;
            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.trim();
                clearTimeout(searchTimeout);

                if (query.length > 0) {
                    clearSearchBtn.classList.remove('hidden');
                    searchTimeout = setTimeout(() => searchMovies(query), 400);
                } else {
                    clearSearchBtn.classList.add('hidden');
                    fetchTrendingMovies();
                }
            });

            clearSearchBtn.addEventListener('click', () => {
                searchInput.value = '';
                clearSearchBtn.classList.add('hidden');
                fetchTrendingMovies();
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeModal();
            });
        }

        async function fetchTrendingMovies() {
            sectionTitle.textContent = "Trending Movies";
            try {
                const res = await fetch(`https://api.themoviedb.org/3/trending/movie/day?api_key=${TMDB_API_KEY}`);
                const data = await res.json();
                renderMovies(data.results);
            } catch (err) {
                console.error("Failed to fetch trending movies:", err);
            }
        }

        async function searchMovies(query) {
            sectionTitle.textContent = `Search Results for "${query}"`;
            try {
                const res = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(query)}`);
                const data = await res.json();
                renderMovies(data.results);
            } catch (err) {
                console.error("Search failed:", err);
            }
        }

        function resetToHome() {
            searchInput.value = '';
            clearSearchBtn.classList.add('hidden');
            fetchTrendingMovies();
        }

        function renderMovies(movies) {
            movieGrid.innerHTML = '';

            const validMovies = movies.filter(m => m.poster_path);

            if (!validMovies || validMovies.length === 0) {
                emptyState.classList.remove('hidden');
                resultCount.textContent = '0 titles';
                return;
            }

            emptyState.classList.add('hidden');
            resultCount.textContent = `${validMovies.length} titles`;

            validMovies.forEach(movie => {
                const year = movie.release_date ? movie.release_date.split('-')[0] : 'N/A';
                const posterUrl = `${TMDB_IMAGE_BASE}${movie.poster_path}`;
                const rating = movie.vote_average ? movie.vote_average.toFixed(1) : 'N/A';

                const card = document.createElement('div');
                card.className = "group relative bg-brand-card rounded-xl overflow-hidden border border-brand-border hover:border-brand-red/80 transition-all duration-300 hover:-translate-y-1.5 cursor-pointer flex flex-col shadow-xl";

                card.innerHTML = `
                    <div class="relative aspect-[2/3] w-full overflow-hidden bg-gray-950">
                        <img src="${posterUrl}" alt="${movie.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300 opacity-95 group-hover:opacity-100" loading="lazy">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-end p-4">
                            <span class="inline-flex items-center gap-1.5 text-xs bg-brand-red text-white font-bold px-3 py-1.5 rounded-lg shadow-lg">
                                <i class="fa-solid fa-play text-[10px]"></i> Watch Movie
                            </span>
                        </div>
                        <div class="absolute top-2.5 right-2.5 bg-black/80 backdrop-blur-md text-amber-400 font-bold text-[11px] px-2 py-1 rounded-lg border border-amber-500/20 shadow-md">
                            ★ ${rating}
                        </div>
                    </div>
                    <div class="p-3.5 flex flex-col justify-between flex-grow">
                        <div>
                            <h3 class="font-bold text-white text-xs sm:text-sm line-clamp-1 group-hover:text-brand-red transition-colors">${movie.title}</h3>
                            <div class="flex items-center justify-between text-[11px] text-gray-500 mt-1.5">
                                <span>${year}</span>
                                <span class="font-mono text-[10px] bg-brand-dark px-1.5 py-0.5 rounded border border-brand-border/60 text-gray-400">ID: ${movie.id}</span>
                            </div>
                        </div>
                    </div>
                `;

                card.addEventListener('click', () => openPlayerModal(movie));
                movieGrid.appendChild(card);
            });
        }

        function openPlayerModal(movie) {
            currentActiveMovie = movie;
            modalTitle.textContent = movie.title;
            modalYear.textContent = movie.release_date ? movie.release_date.split('-')[0] : 'N/A';
            modalImdbId.textContent = `TMDB ID: ${movie.id}`;
            modalOverview.textContent = movie.overview || 'No description available.';

            movieModal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';

            loadStreamForCurrentMovie();
        }

        function switchServer(serverName) {
            currentServer = serverName;

            // Update active states on buttons
            ['vidlink', 'vidsrc', 'embedsu'].forEach(s => {
                const btn = document.getElementById(`btn-server-${s}`);
                if (s === serverName) {
                    btn.className = "server-btn bg-brand-red text-white font-bold px-3 py-1.5 rounded-lg transition-colors";
                } else {
                    btn.className = "server-btn bg-brand-border hover:bg-brand-hover text-gray-300 font-medium px-3 py-1.5 rounded-lg transition-colors";
                }
            });

            loadStreamForCurrentMovie();
        }

        function loadStreamForCurrentMovie() {
            if (!currentActiveMovie) return;
            const tmdbId = currentActiveMovie.id;
            
            let url = '';
            if (currentServer === 'vidlink') {
                url = `https://vidlink.pro/movie/${tmdbId}?primaryColor=e50914&autoplay=true&sub=en`;
            } else if (currentServer === 'vidsrc') {
                url = `https://vidsrc.cc/v2/embed/movie/${tmdbId}?autoPlay=true`;
            } else if (currentServer === 'embedsu') {
                url = `https://embed.su/embed/movie/${tmdbId}`;
            }

            streamIframe.src = url;
        }

        async function playDirectId() {
            const input = document.getElementById('direct-id-input');
            const rawVal = input.value.trim().replace('tt', '');
            if (!rawVal) return;

            try {
                const res = await fetch(`https://api.themoviedb.org/3/movie/${rawVal}?api_key=${TMDB_API_KEY}`);
                if (!res.ok) throw new Error("Movie not found");
                const movieData = await res.json();
                
                openPlayerModal(movieData);
            } catch (err) {
                alert("Invalid TMDB ID or movie not found in database.");
            }
            input.value = '';
        }

        function closeModal() {
            movieModal.classList.add('hidden');
            streamIframe.src = '';
            document.body.style.overflow = 'auto';
            currentActiveMovie = null;
        }
    </script>
</body>
</html>
