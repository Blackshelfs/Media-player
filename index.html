<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineStream - Personal Cinema</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            red: '#E50914',
                            dark: '#0B0B0C',
                            card: '#141416',
                            border: '#26262A',
                            hover: '#1D1D21'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0B0B0C; }
        ::-webkit-scrollbar-thumb { background: #26262A; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #E50914; }
    </style>
</head>
<body class="bg-brand-dark text-gray-100 font-sans min-h-screen flex flex-col antialiased selection:bg-brand-red selection:text-white">

    <!-- Header & Navigation -->
    <header class="sticky top-0 z-40 bg-brand-dark/90 backdrop-blur-xl border-b border-brand-border/60 px-4 sm:px-8 py-3.5">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-3">
            
            <!-- Brand Logo -->
            <div class="flex items-center space-x-2.5 cursor-pointer group" onclick="resetToHome()">
                <div class="bg-brand-red p-2 rounded-lg shadow-lg shadow-brand-red/20 group-hover:scale-105 transition-transform duration-200">
                    <i class="fa-solid fa-play text-sm text-white"></i>
                </div>
                <span class="text-xl font-extrabold tracking-wider text-white">CINE<span class="text-brand-red">STREAM</span></span>
            </div>

            <!-- Search & Direct ID Bar -->
            <div class="flex items-center gap-2 w-full md:w-auto flex-1 max-w-2xl justify-end">
                <form id="search-form" class="relative flex-1 max-w-md">
                    <div class="relative flex items-center">
                        <i class="fa-solid fa-magnifying-glass absolute left-3.5 text-gray-500 text-xs"></i>
                        <input 
                            type="text" 
                            id="search-input" 
                            placeholder="Search catalog or ID..." 
                            class="w-full bg-brand-card text-gray-200 text-xs rounded-lg pl-9 pr-8 py-2.5 border border-brand-border focus:outline-none focus:border-brand-red transition-colors placeholder-gray-500"
                            autocomplete="off"
                        >
                        <button type="button" id="clear-search" class="hidden absolute right-3 text-gray-500 hover:text-white text-xs">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                </form>

                <!-- Direct ID Input -->
                <div class="flex items-center space-x-1.5">
                    <input 
                        type="text" 
                        id="direct-id-input" 
                        placeholder="TMDB ID..." 
                        class="bg-brand-card text-xs text-gray-200 px-3 py-2.5 rounded-lg border border-brand-border focus:outline-none focus:border-brand-red w-28 sm:w-32"
                    >
                    <button 
                        onclick="playDirectId()" 
                        class="bg-brand-red hover:bg-red-700 text-white font-bold text-xs px-3.5 py-2.5 rounded-lg transition-colors flex items-center gap-1 shadow-md whitespace-nowrap"
                    >
                        <i class="fa-solid fa-play text-[10px]"></i> Direct Play
                    </button>
                </div>
            </div>

        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-8 py-6">
        
        <!-- Status Header -->
        <div class="flex items-center justify-between mb-6 pb-3 border-b border-brand-border/40">
            <div>
                <h1 id="section-title" class="text-xl sm:text-2xl font-bold tracking-tight text-white flex items-center gap-2.5">
                    Featured Collection
                </h1>
            </div>
            <div id="result-count" class="text-[11px] font-medium px-2.5 py-0.5 bg-brand-card text-gray-400 rounded-md border border-brand-border">
                Ready
            </div>
        </div>

        <!-- Movie Grid Container -->
        <div id="movie-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3.5 sm:gap-5">
            <!-- Rendered dynamically -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden flex-col items-center justify-center py-20 text-center">
            <div class="w-16 h-16 bg-brand-card rounded-full flex items-center justify-center mb-3 text-gray-600 text-2xl border border-brand-border">
                <i class="fa-solid fa-film"></i>
            </div>
            <h3 class="text-lg font-bold text-gray-300">No Movies Found</h3>
            <p class="text-gray-500 text-xs max-w-xs mt-1">Try searching for popular titles or pass a valid movie ID.</p>
        </div>

    </main>

    <!-- Movie Player Modal -->
    <div id="movie-modal" class="fixed inset-0 z-50 hidden bg-black/95 backdrop-blur-xl flex items-center justify-center p-2 sm:p-6 overflow-y-auto">
        <div class="relative bg-brand-card w-full max-w-5xl rounded-xl overflow-hidden shadow-2xl border border-brand-border my-auto flex flex-col">
            
            <!-- Minimal Modal Header -->
            <div class="flex items-center justify-between px-5 py-3 border-b border-brand-border bg-black/50">
                <div class="flex items-center space-x-2.5">
                    <span class="w-2 h-2 rounded-full bg-brand-red animate-pulse"></span>
                    <h2 id="modal-title" class="text-base sm:text-lg font-bold text-white truncate max-w-md">Movie Title</h2>
                </div>
                
                <button id="close-modal" onclick="closeModal()" class="w-8 h-8 bg-brand-border/40 hover:bg-brand-red text-gray-400 hover:text-white rounded-lg flex items-center justify-center transition-colors">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
            </div>

            <!-- Video Player Frame -->
            <div class="relative w-full aspect-video bg-black flex items-center justify-center">
                <iframe 
                    id="stream-iframe" 
                    class="w-full h-full border-0" 
                    allowfullscreen 
                    allow="autoplay; encrypted-media; picture-in-picture"
                ></iframe>
            </div>

            <!-- Compact Movie Metadata -->
            <div class="p-5 bg-brand-card">
                <div class="flex items-center gap-2.5 text-xs text-gray-400 mb-1.5">
                    <span id="modal-year" class="font-bold text-gray-200">Year</span>
                    <span>&bull;</span>
                    <span id="modal-imdb-id" class="bg-amber-500/10 text-amber-400 px-2 py-0.5 rounded text-[11px] font-mono border border-amber-500/20">ID</span>
                </div>
                <p id="modal-overview" class="text-gray-400 text-xs sm:text-sm leading-relaxed max-w-3xl">
                    Overview...
                </p>
            </div>

        </div>
    </div>

    <!-- Script Logic -->
    <script>
        const CATALOG_MOVIES = [
            {
                id: "tt1675434",
                tmdb_id: "77338",
                title: "The Intouchables",
                release_date: "2011-11-02",
                vote_average: 8.5,
                poster_path: "https://image.tmdb.org/t/p/w500/34m2tyg32R2P9L3R3391pB0mC6Z.jpg",
                overview: "After he becomes a quadriplegic from a paragliding accident, an aristocrat hires a young man from the projects to be his caregiver."
            },
            {
                id: "tt0816692",
                tmdb_id: "157336",
                title: "Interstellar",
                release_date: "2014-11-07",
                vote_average: 8.4,
                poster_path: "https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg",
                overview: "A team of explorers travel through a wormhole in space in an attempt to ensure humanity's survival."
            },
            {
                id: "tt0094226",
                tmdb_id: "11782",
                title: "The Untouchables",
                release_date: "1987-06-03",
                vote_average: 7.9,
                poster_path: "https://image.tmdb.org/t/p/w500/A8114oN09A7P43v1k2R8xW4s6K1.jpg",
                overview: "Federal Agent Eliot Ness sets out to stop ruthless Chicago gangster Al Capone, assembling a small team of trustworthy officers to help him."
            },
            {
                id: "tt1300854",
                tmdb_id: "68721",
                title: "Iron Man 3",
                release_date: "2013-05-03",
                vote_average: 7.1,
                poster_path: "https://image.tmdb.org/t/p/w500/qhPtL1nHC138vFi2yA9A8pC6k.jpg",
                overview: "When Tony Stark's world is torn apart by a formidable terrorist called the Mandarin, he starts an odyssey of rebuilding and retribution."
            },
            {
                id: "tt1375666",
                tmdb_id: "27205",
                title: "Inception",
                release_date: "2010-07-16",
                vote_average: 8.4,
                poster_path: "https://image.tmdb.org/t/p/w500/oYuLE13zVCgQhxUYmeKWBNvftoo.jpg",
                overview: "A thief who steals corporate secrets through the use of dream-sharing technology is given the inverse task of planting an idea into the mind of a C.E.O."
            },
            {
                id: "tt0468569",
                tmdb_id: "155",
                title: "The Dark Knight",
                release_date: "2008-07-18",
                vote_average: 8.5,
                poster_path: "https://image.tmdb.org/t/p/w500/qJ2tW6WMUDux911r6m7haRef0WH.jpg",
                overview: "When the menace known as the Joker wreaks havoc and chaos on the people of Gotham, Batman must accept one of the greatest psychological tests."
            },
            {
                id: "tt4154796",
                tmdb_id: "299534",
                title: "Avengers: Endgame",
                release_date: "2019-04-26",
                vote_average: 8.3,
                poster_path: "https://image.tmdb.org/t/p/w500/or06FN3Dka5tukK1e9sl16pB3iy.jpg",
                overview: "After the devastating events of Infinity War, the universe is in ruins. With the help of remaining allies, the Avengers assemble once more."
            },
            {
                id: "tt0110912",
                tmdb_id: "680",
                title: "Pulp Fiction",
                release_date: "1994-10-14",
                vote_average: 8.5,
                poster_path: "https://image.tmdb.org/t/p/w500/d5iIlFn5s0ImszYzBPb8JPIfbXD.jpg",
                overview: "The lives of two mob hitmen, a boxer, a gangster and his wife, and a pair of diner bandits intertwine in four tales of violence and redemption."
            }
        ];

        let currentActiveMovie = null;

        /* DOM Elements */
        const movieGrid = document.getElementById('movie-grid');
        const searchForm = document.getElementById('search-form');
        const searchInput = document.getElementById('search-input');
        const clearSearchBtn = document.getElementById('clear-search');
        const emptyState = document.getElementById('empty-state');
        const resultCount = document.getElementById('result-count');
        const sectionTitle = document.getElementById('section-title');
        
        const movieModal = document.getElementById('movie-modal');
        const streamIframe = document.getElementById('stream-iframe');
        const modalTitle = document.getElementById('modal-title');
        const modalYear = document.getElementById('modal-year');
        const modalImdbId = document.getElementById('modal-imdb-id');
        const modalOverview = document.getElementById('modal-overview');

        /* Initialize App */
        window.addEventListener('DOMContentLoaded', () => {
            renderMovies(CATALOG_MOVIES);
            setupEvents();
        });

        function setupEvents() {
            searchForm.addEventListener('submit', (e) => {
                e.preventDefault();
                performSearch(searchInput.value.trim());
            });

            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.trim();
                if (query.length > 0) {
                    clearSearchBtn.classList.remove('hidden');
                    performSearch(query);
                } else {
                    clearSearchBtn.classList.add('hidden');
                    renderMovies(CATALOG_MOVIES, "Featured Collection");
                }
            });

            clearSearchBtn.addEventListener('click', () => {
                searchInput.value = '';
                clearSearchBtn.classList.add('hidden');
                renderMovies(CATALOG_MOVIES, "Featured Collection");
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeModal();
            });
        }

        function resetToHome() {
            searchInput.value = '';
            clearSearchBtn.classList.add('hidden');
            renderMovies(CATALOG_MOVIES, "Featured Collection");
        }

        function performSearch(query) {
            if (!query) return;

            const matches = CATALOG_MOVIES.filter(m => 
                m.title.toLowerCase().includes(query.toLowerCase()) || 
                m.id.toLowerCase() === query.toLowerCase() ||
                (m.tmdb_id && m.tmdb_id.toString() === query) ||
                m.overview.toLowerCase().includes(query.toLowerCase())
            );

            renderMovies(matches, `Search Results (${matches.length})`);
        }

        function renderMovies(movies, title = "Featured Collection") {
            sectionTitle.textContent = title;
            movieGrid.innerHTML = '';

            if (!movies || movies.length === 0) {
                emptyState.classList.remove('hidden');
                resultCount.textContent = '0 titles';
                return;
            }

            emptyState.classList.add('hidden');
            resultCount.textContent = `${movies.length} titles`;

            movies.forEach(movie => {
                const year = movie.release_date ? movie.release_date.split('-')[0] : 'N/A';
                const card = document.createElement('div');
                card.className = "group relative bg-brand-card rounded-lg overflow-hidden border border-brand-border hover:border-brand-red/80 transition-all duration-300 hover:-translate-y-1 cursor-pointer flex flex-col shadow-lg";

                card.innerHTML = `
                    <div class="relative aspect-[2/3] w-full overflow-hidden bg-gray-950">
                        <img src="${movie.poster_path}" alt="${movie.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300 opacity-90 group-hover:opacity-100" loading="lazy">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-end p-3">
                            <span class="inline-flex items-center gap-1 text-[11px] bg-brand-red text-white font-bold px-2.5 py-1 rounded shadow-md">
                                <i class="fa-solid fa-play text-[9px]"></i> Watch
                            </span>
                        </div>
                        <div class="absolute top-2 right-2 bg-black/80 backdrop-blur-md text-amber-400 font-bold text-[10px] px-1.5 py-0.5 rounded border border-amber-500/20">
                            ★ ${movie.vote_average}
                        </div>
                    </div>
                    <div class="p-3 flex flex-col justify-between flex-grow">
                        <div>
                            <h3 class="font-bold text-white text-xs line-clamp-1 group-hover:text-brand-red transition-colors">${movie.title}</h3>
                            <div class="flex items-center justify-between text-[11px] text-gray-500 mt-1">
                                <span>${year}</span>
                                <span class="font-mono text-[9px] bg-brand-dark px-1 py-0.5 rounded border border-brand-border/60">TMDB: ${movie.tmdb_id || 'N/A'}</span>
                            </div>
                        </div>
                    </div>
                `;

                card.addEventListener('click', () => openPlayerModal(movie));
                movieGrid.appendChild(card);
            });
        }

        function openPlayerModal(movie) {
            currentActiveMovie = movie;
            modalTitle.textContent = movie.title;
            modalYear.textContent = movie.release_date ? movie.release_date.split('-')[0] : 'N/A';
            modalImdbId.textContent = `${movie.id} • TMDB: ${movie.tmdb_id || 'N/A'}`;
            modalOverview.textContent = movie.overview || 'No description available.';

            movieModal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';

            loadStreamForCurrentMovie();
        }

        function loadStreamForCurrentMovie() {
            if (!currentActiveMovie) return;

            const tmdbId = currentActiveMovie.tmdb_id || '27205';

            // Switched to NexStream embed API format
            streamIframe.src = `https://api.codespecters.com/embed/movie/${tmdbId}`;
        }

        function playDirectId() {
            const input = document.getElementById('direct-id-input');
            const rawVal = input.value.trim();
            if (!rawVal) return;

            const movieObj = {
                id: `tt${rawVal.replace('tt', '')}`,
                tmdb_id: rawVal.replace('tt', ''),
                title: `Custom Movie (TMDB: ${rawVal})`,
                release_date: 'N/A',
                vote_average: 'N/A',
                overview: 'Direct stream player mode.'
            };

            openPlayerModal(movieObj);
            input.value = '';
        }

        function closeModal() {
            movieModal.classList.add('hidden');
            streamIframe.src = '';
            document.body.style.overflow = 'auto';
            currentActiveMovie = null;
        }
    </script>
</body>
</html>
